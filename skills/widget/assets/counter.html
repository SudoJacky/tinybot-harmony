<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><main class="tb-card tb-stack"><h2 class="tb-title">Counter</h2><output class="tb-number" id="count">0</output><button class="tb-button tb-primary" id="reset">Reset</button></main><script>let saved;async function start(){saved=await tinybot.storage.load();document.querySelector("#count").textContent=saved.value?.count||0}document.querySelector("#reset").onclick=async()=>{try{saved=await tinybot.storage.save({count:0},saved.revision);document.querySelector("#count").textContent="0"}catch(e){document.querySelector("#count").textContent=e.message}};start();</script></body></html>
