<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>/*BUILTIN_STYLE*/
.widget.ascii{height:var(--tinybot-card-height,208px);min-height:164px;display:flex;flex-direction:column;gap:5px;padding:12px 16px;border-radius:24px;border:1px solid #29463e;background:radial-gradient(ellipse at 50% 65%,#163a32 0%,#0b1818 48%,#091112 100%);color:#b3f6dc;overflow:hidden}
.ascii header,.ascii footer{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0;font:9px/16px monospace;letter-spacing:.13em}.ascii header{justify-content:flex-end;color:#78a597}.ascii .brand{color:#d5eee3;letter-spacing:.2em}.ascii footer{font-size:8px;color:#718f83;letter-spacing:.1em}.ascii #mode{color:#8bcbb0}
.ascii .scene{position:relative;display:flex;align-items:center;justify-content:center;flex:1;min-height:100px;width:100%;padding:0;border:0;border-radius:0;color:#92f3c7;background:transparent;touch-action:pan-y;overflow:hidden;transform:none!important;transition:color .35s;text-shadow:0 0 7px #5bf2b94d}.ascii .scene:focus-visible{outline:1px solid #79e8bb;outline-offset:-2px}.ascii .scene::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,#07151228 3px 4px);pointer-events:none}.ascii pre{margin:0;white-space:pre;text-align:left;letter-spacing:0;font-family:monospace;font-variant-ligatures:none;font-weight:500;user-select:none}.ascii[data-warp=true] .scene{color:#ffd5ac;text-shadow:0 0 8px #ffab744d}.ascii[data-warp=true] #mode{color:#f2bd91}
@media(max-width:240px){.widget.ascii{padding:10px}.ascii header,.ascii footer{font-size:8px;letter-spacing:.04em}.ascii .brand{letter-spacing:.08em}}
</style></head><body><article class="widget ascii" data-warp="false" aria-label="ASCII gravitational field">
<header><span class="brand">EVENT HORIZON</span></header>
<button class="scene" id="warp" data-aria-zh="切换 ASCII 动画" data-aria-en="Switch ASCII animation"><pre id="ascii" aria-hidden="true"></pre></button>
<footer><span id="mode">TINYBOT</span><span id="hint"></span></footer><p id="status" class="status" role="status"></p>
</article><script>/*BUILTIN_RUNTIME*/
const scene=$('warp'),screen=$('ascii'),art=document.querySelector('.ascii'),motion=matchMedia('(prefers-reduced-motion:reduce)');
const ramp=' .:-=+*#%@',TAU=Math.PI*2,stars=Array.from({length:55},(_,i)=>({x:Math.sin(i*127.1+4)*.5,y:Math.sin(i*311.7+8)*.5,z:(i*.61803398875)%1}));
let cols=76,rows=20,angle=.7,mode=0,boosted=false,lastPaint=-1,elapsed=0,sceneTime=0;
const mesh=[];for(let u=0;u<112;u++)for(let v=0;v<28;v++){
  const a=u/112*TAU,b=v/28*TAU,cu=Math.cos(a),su=Math.sin(a),cv=Math.cos(b),sv=Math.sin(b),r=1.08+.38*cv;
  mesh.push([r*cu,.38*sv,r*su,cv*cu,sv,cv*su]);
}
function labels(){localize();$('hint').textContent=mode===0?tr('轻触启航','TAP TO EXPLORE'):boosted?tr('再触返回','TAP TO RETURN'):tr('轻触跃迁','TAP TO WARP');$('mode').textContent=['TINYBOT','ORBITAL','HYPERDRIVE'][mode];art.dataset.warp=String(boosted);}
function mascot(time){
  // Tinybot's circular single eye and upper-right satellite, matching the app mark.
  const radius=rows*.37,cx=cols*.48,cy=rows*.53+Math.sin(time*1.7)*.35;
  const blink=Math.max(0,1-Math.abs((time%4.8)-3.9)/.13),eyeHeight=.23*(1-blink)+.035;
  const eyeX=-.29+Math.sin(time*.8)*.035,eyeY=-.30;
  const satelliteX=1.04+Math.sin(time*.9)*.06,satelliteY=-1.02+Math.cos(time*.9)*.06;
  const lines=[];
  for(let y=0;y<rows;y++){
    let line='';for(let x=0;x<cols;x++){
      const px=(x-cx)/(radius*1.95),py=(y-cy)/radius,d=px*px+py*py;
      const satellite=Math.hypot(px-satelliteX,py-satelliteY);
      let char=' ';
      if(satellite<.16)char=satellite<.09?'@':'+';
      else if(d<1){
        const z=Math.sqrt(1-d),eye=(px-eyeX)**2/.23**2+(py-eyeY)**2/eyeHeight**2;
        if(eye<1)char=eye<.67?'@':'%';
        else if(d>.78)char='=+*#%@@'[Math.min(6,Math.floor((1-z)*7))];
        else char=' .:-'[Math.floor(Math.max(0,Math.min(3,(.35-px*.45-py*.35)*3)))];
      }
      line+=char;
    }lines.push(line);
  }
  screen.textContent=lines.join('\n');
}
function render(time){
  if(mode===0){mascot(time);return;}
  const cells=new Array(cols*rows).fill(' '),depth=new Float32Array(cols*rows);
  function put(x,y,z,char){x=Math.round(x);y=Math.round(y);if(x<0||x>=cols||y<0||y>=rows)return;const i=y*cols+x;if(z>=depth[i]){depth[i]=z;cells[i]=char;}}
  for(let i=0;i<stars.length;i++){
    const star=stars[i],z=(star.z+time*(boosted ? .32 : .012))%1,spread=boosted ? .2+z*2.8 : 1;
    put(cols*(.5+star.x*spread),rows*(.5+star.y*spread),.01,boosted?(z>.7?'+':':'):(Math.sin(time+i*2)> .25?'.':','));
  }
  const ax=.7+Math.sin(angle*.53)*.42,ay=angle*.72,az=angle*.31;
  const cx=Math.cos(ax),sx=Math.sin(ax),cy=Math.cos(ay),sy=Math.sin(ay),cz=Math.cos(az),sz=Math.sin(az);
  function rotate(x,y,z){const y1=y*cx-z*sx,z1=y*sx+z*cx,x2=x*cy+z1*sy,z2=z1*cy-x*sy;return[x2*cz-y1*sz,x2*sz+y1*cz,z2];}
  for(const point of mesh){
    const p=rotate(point[0],point[1],point[2]),n=rotate(point[3],point[4],point[5]),z=1/(4+p[2]);
    const light=Math.max(0,Math.min(1,.25+(n[0]*-.25+n[1]*.6-n[2]*.75)*.72));
    put(cols/2+p[0]*cols*.93*z,rows/2+p[1]*rows*1.17*z,z,ramp[Math.min(9,Math.floor(light*10))]);
  }
  for(let i=0;i<220;i++){
    const a=i/220*TAU,p=rotate(1.88*Math.cos(a),.06*Math.sin(a*3+angle),1.88*Math.sin(a)),z=1/(4+p[2]);
    put(cols/2+p[0]*cols*.93*z,rows/2+p[1]*rows*1.17*z,z,i%7===0?'+':'.');
  }
  const lines=[];for(let y=0;y<rows;y++)lines.push(cells.slice(y*cols,(y+1)*cols).join(''));
  screen.textContent=lines.join('\n');
}
function measure(){
  const box=scene.getBoundingClientRect();if(box.width<=0||box.height<=0)return;
  cols=Math.max(36,Math.min(108,Math.floor(box.width/4.1)));rows=Math.max(12,Math.min(32,Math.floor(box.height/7.3)));
  const size=Math.min(box.width/(cols*.61),box.height/(rows*1.12));screen.style.fontSize=size+'px';screen.style.lineHeight=size*1.12+'px';render(sceneTime);
}
scene.onclick=()=>{mode=(mode+1)%3;boosted=mode===2;labels();render(sceneTime);};
tinybot.panel.onUpdate(next=>{context=next;labels();});
const observer=new ResizeObserver(measure);observer.observe(scene);motion.addEventListener('change',()=>{lastPaint=-1;measure();});
labels();measure();
tinybot.animate((time,delta)=>{
  if(motion.matches)return;elapsed+=delta;if(time-lastPaint<1/15)return;
  sceneTime+=Math.min(elapsed,.2);angle+=Math.min(elapsed,.2)*(boosted?2.8:.42);elapsed=0;lastPaint=time;render(sceneTime);
});
</script></body></html>
