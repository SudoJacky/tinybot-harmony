<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>/*BUILTIN_STYLE*/
.widget{--tone:#7e75a1}.hero{padding:20px 0 14px}.number{font-size:64px;line-height:1.15;font-weight:550}.unit{font-size:12px;color:var(--tone);margin-left:8px}.event{margin-top:10px;font-size:17px;font-weight:550;overflow-wrap:anywhere}.event-date{font-size:12px;color:var(--muted);margin-top:3px}.edit{font-size:12px;color:var(--tone);padding:5px 8px}.fields{display:grid;gap:10px;margin-top:14px}.empty-title{font-size:25px;line-height:1.3;letter-spacing:-.04em;margin:20px 0 8px}.footer{font-size:11px;color:var(--muted);border-top:1px solid color-mix(in srgb,var(--tone) 14%,transparent);padding-top:12px;margin-top:5px}.fields .actions{margin-top:2px}
</style></head><body><article class="widget" aria-label="Countdown"><header class="head"><span class="eyebrow"><i class="dot"></i><span data-zh="把期待，放在眼前" data-en="SOMETHING TO LOOK FORWARD TO"></span></span><button id="edit-event" class="edit" data-zh="编辑" data-en="Edit"></button></header><section id="event-view" class="hero"><div><output id="days" class="number numeric"></output><span id="unit" class="unit"></span></div><h2 id="event" class="event"></h2><p id="date" class="event-date"></p></section><div id="welcome"><h2 class="empty-title" data-zh="留一点期待。" data-en="Make room for a good day."></h2><p class="meta" data-zh="旅行、纪念日，或自己的小目标。" data-en="A trip, an anniversary, a little goal."></p></div><form id="event-form" class="fields"><label class="field"><span data-zh="日子名称" data-en="Event name"></span><input id="event-name" maxlength="60" required></label><label class="field"><span data-zh="日期" data-en="Date"></span><input id="event-date" type="date" required></label><div class="actions"><button id="save-event" class="primary" type="submit" data-zh="记住这一天" data-en="Save this day"></button><button id="cancel-event" class="soft" type="button" data-zh="取消" data-en="Cancel"></button></div></form><p id="footer" class="footer"></p><p id="status" class="status" role="status"></p></article><script>/*BUILTIN_RUNTIME*/
let editing=false,lastDay='';
function validDate(date){if(typeof date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(date))return false;const [y,m,d]=date.split('-').map(Number),v=new Date(y,m-1,d);return y>=1900&&y<=9999&&v.getFullYear()===y&&v.getMonth()===m-1&&v.getDate()===d;}
function render(){
  const value=snapshot.value,has=!!value,showForm=!has||editing;$('event-view').hidden=!has;$('welcome').hidden=has;$('event-form').hidden=!showForm;$('edit-event').hidden=!has||editing;$('cancel-event').hidden=!has;
  $('footer').textContent=tr('日历按本地日期计算','Based on your local calendar');
  if(!has)return;const now=new Date(),[y,m,d]=value.date.split('-').map(Number),days=Math.round((Date.UTC(y,m-1,d)-Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()))/86400000);
  $('days').textContent=String(Math.abs(days));$('unit').textContent=days>0?tr('天后','days to go'):days===0?tr('就是今天','Today'):tr('天前','days ago');$('event').textContent=value.name;$('date').textContent=new Intl.DateTimeFormat(context.locale,{year:'numeric',month:'long',day:'numeric'}).format(new Date(y,m-1,d));
}
$('edit-event').onclick=()=>{editing=true;$('event-name').value=snapshot.value.name;$('event-date').value=snapshot.value.date;render();};
$('cancel-event').onclick=()=>{editing=false;status('');render();};
async function saveEvent(){const name=$('event-name').value.trim(),date=$('event-date').value;if(!name||!validDate(date)){status(tr('请填写名称和有效日期。','Enter a name and a valid date.'));return;}if(await commit({name,date})){editing=false;render();}}
$('save-event').type='button';$('save-event').onclick=saveEvent;
$('event-form').onkeydown=event=>{if(event.key==='Enter'&&!event.isComposing){event.preventDefault();saveEvent();}};
initialize(render,value=>{if(value!==null&&(!value||typeof value.name!=='string'||!value.name.trim()||value.name.length>60||!validDate(value.date)))invalidState();});
tinybot.animate(()=>{const day=new Date().toDateString();if(day!==lastDay){lastDay=day;render();}});
</script></body></html>
