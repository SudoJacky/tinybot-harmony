<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>/*BUILTIN_STYLE*/
.widget{--tone:#5f8471}.title{margin-top:12px}.count{font-size:11px;color:var(--tone);padding:4px 9px;background:color-mix(in srgb,var(--tone) 10%,transparent);border-radius:12px}.track{height:3px;border-radius:3px;background:color-mix(in srgb,var(--tone) 12%,transparent);margin:14px 0}.track i{display:block;height:100%;background:var(--tone);border-radius:3px;transition:width 180ms}#tasks{list-style:none;padding:0;margin:0 0 14px;max-height:208px;overflow:auto}.task{display:flex;align-items:center;border-bottom:1px solid color-mix(in srgb,var(--tone) 10%,transparent);gap:6px}.check{display:flex;align-items:center;gap:10px;text-align:left;flex:1;min-width:0;padding:10px 0}.check i{width:19px;height:19px;flex-shrink:0;border:1.5px solid var(--tone);border-radius:50%;display:grid;place-items:center;font-size:11px;font-style:normal}.check span{overflow-wrap:anywhere;font-size:14px}.check[aria-pressed=true] span{text-decoration:line-through;color:var(--muted)}.check[aria-pressed=true] i{background:var(--tone);color:var(--surface)}.remove{width:44px;flex-shrink:0;color:var(--muted);font-size:18px;padding:0}.empty{padding:22px 0 30px;color:var(--muted);font-size:13px}.entry{display:flex;gap:8px}.entry input{flex:1;min-width:0}.entry button{width:44px;flex-shrink:0;padding:0;font-size:22px}.foot{margin-top:10px;font-size:11px;color:var(--muted)}
</style></head><body><article class="widget" aria-label="Checklist"><header class="head"><span class="eyebrow"><i class="dot"></i><span data-zh="一点点，也算向前" data-en="SMALL STEPS COUNT"></span></span><span id="count" class="count numeric">0/0</span></header><h2 class="title" data-zh="今日小事" data-en="Little things today"></h2><div class="track" aria-hidden="true"><i id="progress"></i></div><p id="empty" class="empty" data-zh="从一件小事开始。" data-en="Start with one small thing."></p><ul id="tasks"></ul><form id="task-form" class="entry"><label class="sr-only" for="new-task" data-zh="添加待办" data-en="Add a task"></label><input id="new-task" maxlength="120" autocomplete="off"><button id="add-task" class="primary" type="submit" data-aria-zh="添加待办" data-aria-en="Add a task">+</button></form><p id="foot" class="foot"></p><p id="status" class="status" role="status"></p></article><script>/*BUILTIN_RUNTIME*/
function items(){return snapshot.value?.items||[];}
function render(){
  const list=items(),done=list.filter(item=>item.done).length;$('count').textContent=done+'/'+list.length;$('progress').style.width=(list.length?done/list.length*100:0)+'%';
  $('empty').hidden=list.length>0;$('tasks').replaceChildren();$('new-task').placeholder=tr('下一件小事…','The next small thing…');
  $('foot').textContent=list.length?tr('按自己的节奏，一件一件来。','At your own pace, one by one.'):tr('只保存在这张卡片里','Saved in this card');
  for(const item of list){
    const row=document.createElement('li');row.className='task';
    const check=document.createElement('button');check.className='check';check.setAttribute('aria-pressed',String(item.done));
    const circle=document.createElement('i');circle.setAttribute('aria-hidden','true');circle.textContent=item.done?'✓':'';const label=document.createElement('span');label.textContent=item.text;check.append(circle,label);
    check.onclick=()=>commit({items:items().map(next=>next.id===item.id?{...next,done:!next.done}:next)});
    const remove=document.createElement('button');remove.className='remove';remove.textContent='×';remove.setAttribute('aria-label',tr('删除：','Delete: ')+item.text);remove.onclick=()=>commit({items:items().filter(next=>next.id!==item.id)});
    row.append(check,remove);$('tasks').append(row);
  }
}
async function addTask(){const text=$('new-task').value.trim();if(!text)return;if(items().length>=30){status(tr('最多保留 30 件小事，请先整理清单。','Keep up to 30 tasks. Clear some items first.'));return;}if(await commit({items:[...items(),{id:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10),text,done:false}]}))$('new-task').value='';}
$('add-task').type='button';$('add-task').onclick=addTask;
$('task-form').onkeydown=event=>{if(event.key==='Enter'&&!event.isComposing){event.preventDefault();addTask();}};
initialize(render,value=>{if(value!==null&&(!value||!Array.isArray(value.items)||value.items.length>30||value.items.some(item=>!item||typeof item.id!=='string'||typeof item.text!=='string'||!item.text.trim()||item.text.length>120||typeof item.done!=='boolean')||new Set(value.items.map(item=>item.id)).size!==value.items.length))invalidState();});
</script></body></html>
